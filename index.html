<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coming soon</title>
<style>
  :root{--bg:#f6f4ef;--ink:#2b2a27;--muted:#8a857b}
  @media (prefers-color-scheme:dark){:root{--bg:#161514;--ink:#ece8e1;--muted:#8f8a80}}
  *{margin:0;box-sizing:border-box}
  body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 17px/1.6 system-ui,sans-serif;text-align:center;padding:24px}
  .dot{width:14px;height:14px;border-radius:50%;background:#7fa38f;margin:0 auto 24px}
  h1{font:600 28px/1.2 Georgia,serif;margin-bottom:8px}
  p{color:var(--muted)}
</style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1>Coming soon</h1>
    <p>Akan datang</p>
  </main>
</body>
</html>
